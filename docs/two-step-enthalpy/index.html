<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>두 단계 반응의 엔탈피 곡선</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#1b302c;font:16px/1.55 "Malgun Gothic",sans-serif;word-break:keep-all}main{max-width:900px;margin:auto;padding:clamp(20px,4vw,42px) 16px}h1{font-size:clamp(28px,4.6vw,43px);letter-spacing:-.065em;line-height:1.24;margin:6px 0}p{margin:0}header small{font-weight:700;color:#49675c}header p{color:#4d635a}
.modes{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 12px}button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;border:1px solid #abbfb3;background:white;color:#294d41;padding:8px 14px}button[aria-pressed=true],#play{background:#125c4a;color:white;border-color:#125c4a}button:focus-visible,input:focus-visible{outline:3px solid #b66b20;outline-offset:2px}
.sheet{background:white;border:1px solid #c6d3c9;border-radius:16px;overflow:hidden}.plot{padding:12px 12px 0}.unit{font-size:14px;color:#415a51;font-weight:bold;margin:0 0 0 5px}svg{display:block;width:100%;height:282px;overflow:visible}svg text{font-family:inherit;fill:#374e48}.axis{font-size:12px}.name{font-size:14px;font-weight:bold}.barrier{fill:#126459;font-weight:bold;font-size:14px}.current{background:#eaf3ed;padding:10px 17px;display:flex;align-items:baseline;gap:12px;min-height:48px}.current strong{color:#145e49;flex:none}.current span{font-size:15px}
.controls{display:flex;align-items:center;gap:12px;padding:13px 17px;flex-wrap:wrap}.controls label{font-size:14px;font-weight:700}input{min-width:70px;flex:1;accent-color:#19775e}.stats{margin:14px 0 0;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #c8d5cb;background:white;border-radius:12px}.stats div{padding:12px 16px}.stats div+div{border-left:1px solid #d7e1d8}.stats dt{font-size:14px;color:#446056}.stats dd{margin:2px 0 0;font-weight:700;color:#233f35}.note{color:#53665c;font-size:13px;margin-top:8px}
@media(max-width:570px){main{padding:20px 10px}.modes button{font-size:14px;padding:8px}.plot{padding:10px 3px 0}.name{font-size:12px}.controls{gap:8px;padding:10px}.controls button{padding:7px 10px}.stats{grid-template-columns:1fr}.stats div{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;gap:5px}.stats div+div{border-left:0;border-top:1px solid #d7e1d8}.current{padding:9px 12px}.current span{font-size:14px}}
</style></head><body><main>
<header><small>물질과 에너지 · 반응 경로</small><h1>두 단계 반응의 엔탈피 곡선</h1><p>두 봉우리 사이에서 중간체를 찾아보세요. 두 번째 봉우리까지는 어디에서부터 올라가야 할까요?</p></header>
<div class="modes" role="group" aria-label="반응물과 생성물의 엔탈피 비교">
<button type="button" data-mode="exo" aria-pressed="true">발열 · 반응물이 더 높음</button><button type="button" data-mode="endo" aria-pressed="false">흡열 · 반응물이 더 낮음</button></div>
<section class="sheet" aria-label="반응 경로 관찰"><div class="plot"><p class="unit">상대 엔탈피 H (kJ/mol)</p><svg id="graph" role="img" aria-labelledby="description"><title id="description">두 단계 반응의 엔탈피 곡선</title><g id="drawing"></g></svg></div>
<div class="current" role="status"><strong id="state"></strong><span id="explain"></span></div>
<div class="controls"><button type="button" id="play">▶ 재생</button><label for="progress">반응 진행</label><input id="progress" type="range" min="0" max="1000" value="0" step="1"><button type="button" id="next">다음 상태</button></div></section>
<dl class="stats"><div><dt>1단계 활성화 에너지</dt><dd id="first"></dd></div><div><dt>2단계 활성화 에너지</dt><dd id="second"></dd></div><div><dt>전체 반응 엔탈피 ΔH</dt><dd id="delta"></dd></div></dl>
<p class="note">반응물의 엔탈피를 0으로 둔 수업용 모형입니다. 가로축은 반응이 진행되는 경로를 나타냅니다.</p>
</main><script>
const $=id=>document.getElementById(id);
const graph=$('graph'), layer=$('drawing'), slider=$('progress');
const modes=[...document.querySelectorAll('[data-mode]')];
const names=['반응물','전이 상태 1','중간체','전이 상태 2','생성물'];
const levels=[0,80,20,70,-40];
const stages=[0,.25,.5,.75,1];
let position=0,frame=0,playing=false,dot,plotWidth=0;
function svg(tag,attrs,text){
  const node=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const [key,value] of Object.entries(attrs))node.setAttribute(key,value);
  if(text!==undefined)node.textContent=text;
  layer.append(node);return node;
}
function line(x1,y1,x2,y2,attrs){return svg('line',{x1,y1,x2,y2,...attrs});}
const x=t=>45+(plotWidth-77)*t;
const y=h=>43+(80-h)*1.45;
function heightAt(t){
  const i=Math.min(3,Math.floor(t*4)), f=t*4-i;
  return levels[i]+(levels[i+1]-levels[i])*f*f*(3-2*f);
}
const signed=v=>v>0?'+'+v:String(v).replace('-','−');
function barrier(index,label){
  const px=x(stages[index]),top=y(levels[index])+6,bottom=y(levels[index-1])-2;
  line(x(stages[index-1]),bottom+2,px,bottom+2,{stroke:'#759289','stroke-dasharray':'4 4'});
  line(px,top,px,bottom,{stroke:'#197569','stroke-width':1.6});
  for(const [cy,dy] of [[top,5],[bottom,-5]]){
    svg('path',{d:'M '+(px-3)+' '+(cy+dy)+' L '+px+' '+cy+' L '+(px+3)+' '+(cy+dy),fill:'none',stroke:'#197569','stroke-width':1.6});
  }
  svg('text',{x:px-6,y:(top+bottom)/2+4,'text-anchor':'end',class:'barrier'},label);
}
function redraw(){
  plotWidth=Math.max(245,graph.clientWidth);
  graph.setAttribute('viewBox','0 0 '+plotWidth+' 282');layer.replaceChildren();
  for(const h of [-40,0,40,80]){
    line(28,y(h),plotWidth-12,y(h),{stroke:'#e3eae4'});
    svg('text',{x:24,y:y(h)+4,'text-anchor':'end',class:'axis'},signed(h));
  }
  svg('path',{d:'M28 18 V244 H'+(plotWidth-10)+' l-6 -3 m6 3 l-6 3',fill:'none',stroke:'#647c71'});
  svg('text',{x:plotWidth-10,y:267,'text-anchor':'end',class:'axis'},'반응 진행');
  barrier(1,'Eₐ₁');barrier(3,'Eₐ₂');
  let path='M '+x(0)+' '+y(levels[0]);
  for(let i=0;i<4;i++){
    const a=x(stages[i]),b=x(stages[i+1]),step=(b-a)/3;
    path+=' C '+(a+step)+' '+y(levels[i])+' '+(b-step)+' '+y(levels[i+1])+' '+b+' '+y(levels[i+1]);
  }
  svg('path',{d:path,fill:'none',stroke:'#c84f35','stroke-width':3.5,'stroke-linecap':'round'});
  names.forEach((name,i)=>{
    const px=x(stages[i]),py=y(levels[i]);
    svg('circle',{cx:px,cy:py,r:3.4,fill:'#a43c28'});
    svg('text',{x:px,y:py+(i===2||i===0||i===4?19:-12),'text-anchor':i===0?'start':i===4?'end':'middle',class:'name'},name);
  });
  dot=svg('circle',{r:6.2,fill:'#145d50',stroke:'#fff','stroke-width':2});
  update(position);
}
function update(t){
  position=t;slider.value=Math.round(t*1000);
  const h=heightAt(t);dot.setAttribute('cx',x(t));dot.setAttribute('cy',y(h));
  const index=stages.indexOf(t);
  const title=index>=0?names[index]:t<.5?'1단계 진행 중':'2단계 진행 중';
  const text=index>=0?[
    '반응물에서 첫 번째 봉우리까지의 높이 차이가 1단계 활성화 에너지입니다.',
    '첫 번째 봉우리에서 활성화물이 형성됩니다. 상대 엔탈피는 +80 kJ/mol입니다.',
    '1단계에서 생긴 중간체(+20 kJ/mol)가 2단계의 반응물이 됩니다.',
    '중간체에서 이 봉우리까지의 높이 차이가 2단계 활성화 에너지입니다.',
    levels[4]<0?'생성물의 엔탈피가 더 낮아 열을 방출합니다.':'생성물의 엔탈피가 더 높아 열을 흡수합니다.'
  ][index]:t<.25?'첫 번째 전이 상태를 향해 올라갑니다.':t<.5?'첫 번째 봉우리를 지나 중간체로 내려갑니다.':t<.75?'중간체에서 두 번째 전이 상태를 향해 올라갑니다.':'두 번째 봉우리를 지나 생성물로 내려갑니다.';
  if($('state').textContent!==title)$('state').textContent=title;
  if($('explain').textContent!==text)$('explain').textContent=text;
  slider.setAttribute('aria-valuetext',title+' · 상대 엔탈피 '+Math.round(h)+' kJ/mol');
  $('next').textContent=t===1?'처음으로':'다음 상태';
}
function stop(){
  cancelAnimationFrame(frame);playing=false;$('play').textContent=position===1?'↻ 다시 재생':'▶ 재생';
}
function selectMode(mode){
  stop();levels[4]=mode==='exo'?-40:40;position=0;
  modes.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
  $('first').textContent=levels[1]+' − '+levels[0]+' = '+(levels[1]-levels[0])+' kJ/mol';
  $('second').textContent=levels[3]+' − '+levels[2]+' = '+(levels[3]-levels[2])+' kJ/mol';
  $('delta').textContent=signed(levels[4]-levels[0])+' kJ/mol';
  $('description').textContent=(mode==='exo'?'발열':'흡열')+' 반응의 상대 엔탈피. 반응물 0, 전이 상태 1은 80, 중간체 20, 전이 상태 2는 70, 생성물 '+signed(levels[4])+' kJ/mol.';
  redraw();stop();
}
modes.forEach(b=>b.addEventListener('click',()=>selectMode(b.dataset.mode)));
slider.addEventListener('input',()=>{update(Number(slider.value)/1000);stop();});
$('next').addEventListener('click',()=>{update(stages.find(t=>t>position)??0);stop();});
$('play').addEventListener('click',()=>{
  if(playing){stop();return}
  if(position===1)update(0);
  playing=true;$('play').textContent='Ⅱ 일시 정지';
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let start=performance.now(),from=position,target=stages.find(t=>t>from);
  function tick(now){
    const elapsed=now-start,duration=reduced?0:(target-from)*6400;
    if(elapsed<duration)update(from+(target-from)*elapsed/duration);
    else{
      update(target);
      if(target===1){stop();return}
      if(elapsed>=duration+900){from=target;target=stages.find(t=>t>from);start=now;}
    }
    frame=requestAnimationFrame(tick);
  }
  frame=requestAnimationFrame(tick);
});
selectMode('exo');new ResizeObserver(()=>{if(graph.clientWidth!==plotWidth)redraw()}).observe(graph);
</script></body></html>
