<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>활성화 에너지와 반응 엔탈피</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#1b302c;font:16px/1.55 "Malgun Gothic",sans-serif;word-break:keep-all}main{max-width:900px;margin:auto;padding:clamp(20px,4vw,42px) 16px}h1{font-size:clamp(28px,4.6vw,43px);letter-spacing:-.065em;line-height:1.24;margin:6px 0}p{margin:0}header small{font-weight:700;color:#49675c}header p{color:#4d635a}
.modes{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 12px}button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;border:1px solid #abbfb3;background:white;color:#294d41;padding:8px 14px}button[aria-pressed=true],#play{background:#125c4a;color:white;border-color:#125c4a}button:focus-visible,input:focus-visible{outline:3px solid #b66b20;outline-offset:2px}
.sheet{background:white;border:1px solid #c6d3c9;border-radius:16px;overflow:hidden}.plot{padding:12px 12px 0}.unit{font-size:14px;color:#415a51;font-weight:bold;margin:0 0 0 5px}svg{display:block;width:100%;height:282px;overflow:visible}svg text{font-family:inherit;fill:#374e48}.axis{font-size:12px}.name{font-size:14px;font-weight:bold}.barrier{fill:#126459;font-weight:bold;font-size:14px}.current{background:#eaf3ed;padding:10px 17px;display:flex;align-items:baseline;gap:12px;min-height:48px}.current strong{color:#145e49;flex:none}.current span{font-size:15px}
.controls{display:flex;align-items:center;gap:12px;padding:13px 17px;flex-wrap:wrap}.controls label{font-size:14px;font-weight:700}input{min-width:70px;flex:1;accent-color:#19775e}.stats{margin:14px 0 0;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #c8d5cb;background:white;border-radius:12px}.stats div{padding:12px 16px}.stats div+div{border-left:1px solid #d7e1d8}.stats dt{font-size:14px;color:#446056}.stats dd{margin:2px 0 0;font-weight:700;color:#233f35}.note{color:#53665c;font-size:13px;margin-top:8px}
@media(max-width:570px){main{padding:20px 10px}.modes button{font-size:14px;padding:8px}.plot{padding:10px 3px 0}.name{font-size:12px}.controls{gap:8px;padding:10px}.controls button{padding:7px 10px}.stats{grid-template-columns:1fr}.stats div{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;gap:5px}.stats div+div{border-left:0;border-top:1px solid #d7e1d8}.current{padding:9px 12px}.current span{font-size:14px}}
</style>
<style>
.stats{grid-template-columns:1fr 1fr}.plot{padding-top:16px}svg{height:435px}.reading{font-size:14px;font-weight:700;fill:#195e4f;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}.level{font:700 15px Georgia,serif;paint-order:stroke;stroke:white;stroke-width:4px}.modes button{flex:0 1 auto}
@media(max-width:570px){.stats{grid-template-columns:1fr}.reading{font-size:12px}.modes{gap:5px}.modes button{font-size:14px}.unit{font-size:13px}}
main{max-width:1500px;padding-top:clamp(16px,2vw,30px)}
#graph{height:476px}.axis{font-size:clamp(14px,1.55vw,22px);font-weight:600}.name,.reading{font-size:clamp(16px,2vw,28px);font-weight:750}
.level{font:700 clamp(19px,2.5vw,36px) Georgia,serif;fill:#182e2a}.unit{font-size:clamp(15px,1.6vw,23px)}
@media(min-width:900px){.plot{padding:10px 22px 0}.modes{margin:12px 0 8px}}
</style></head><body><main>
<header><small>물질과 에너지 · 반응의 진행</small><h1>활성화 에너지와 반응 엔탈피</h1><p>재생을 눌러 봉우리에서 활성화물을 관찰하고, 반응물과 생성물의 높이를 비교해 보세요.</p></header>
<div class="modes" role="group" aria-label="반응 유형 선택"><button data-mode="exo" aria-pressed="true">발열 반응</button><button data-mode="endo" aria-pressed="false">흡열 반응</button></div>
<section class="sheet" aria-label="반응의 엔탈피 그래프"><div class="plot"><p class="unit">상대 엔탈피 H (kJ/mol)</p>
<svg id="graph" role="img" aria-labelledby="desc"><title id="desc"></title><defs id="defs"></defs><g id="drawing"></g></svg></div>
<div class="current" role="status"><strong id="type"></strong><span id="why"></span></div>
<div class="controls"><button id="play">▶ 재생</button><label for="progress">반응 진행</label><input id="progress" type="range" min="0" max="1000" value="0"><button id="restart">처음으로</button></div></section>
<dl class="stats"><div><dt>활성화 에너지 · 반응물에서 봉우리까지</dt><dd>80 − 0 = 80 kJ/mol</dd></div><div><dt>반응 엔탈피 · 생성물에서 반응물의 엔탈피를 뺀 값</dt><dd id="delta"></dd></div></dl>
<p class="note">반응물의 엔탈피를 0으로 둔 모형값입니다.</p>
</main><script>
const $=id=>document.getElementById(id);
const graph=$('graph'), layer=$('drawing'), slider=$('progress'), modes=[...document.querySelectorAll('[data-mode]')];
const peak=80, enthalpyDifference=65;
let product=-enthalpyDifference,width=0,position=0,playing=false,frame=0,dot;
let mobileModel,referenceModels;
function node(tag,attrs,text,parent=layer){
  const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);
  if(text!==undefined)el.textContent=text;
  parent.append(el);return el;
}
for(const [id,light,dark] of [['A','#ff9b87','#c62920'],['B','#dfa9ee','#82458d'],['C','#b5ea88','#4b992f']]){
  const g=node('radialGradient',{id,cx:'.32',cy:'.27',r:'.78'},undefined,$('defs'));
  node('stop',{offset:'0','stop-color':light},undefined,g);node('stop',{offset:'1','stop-color':dark},undefined,g);
}
function line(x1,y1,x2,y2,attrs){return node('line',{x1,y1,x2,y2,...attrs})}
function text(x,y,str,css,anchor='middle'){return node('text',{x,y,class:css,'text-anchor':anchor},str)}
const axisX=()=>width<570?35:54;
const x=t=>axisX()+(width-axisX()-(width<570?49:76))*t;
const y=h=>278-h*1.9;
const signed=n=>n>0?'+'+n:n<0?'−'+Math.abs(n):'0';
function energy(t){
  if(t<=.2)return 0;
  if(t>=.8)return product;
  const rising=t<=.5, f=(t-(rising?.2:.5))/.3;
  const smooth=f*f*(3-2*f);
  return rising?peak*smooth:peak+(product-peak)*smooth;
}
function makeModel(){
  const group=node('g',{}),spacing=Math.min(54,Math.max(15,(x(1)-x(0))*.055));
  const dotSize=Math.max(3.1,spacing*.14);
  const radii=[.46,.36,.46].map(r=>r*spacing);
  const part=(tag,attrs,content)=>node(tag,attrs,content,group);
  const bonds=[0,1].map(()=>({
    solid:part('line',{stroke:'#35423c','stroke-width':Math.max(3.5,spacing*.12)}),
    dotted:part('line',{stroke:'#25282a','stroke-width':dotSize,pathLength:3,'stroke-dasharray':'0 1','stroke-dashoffset':-.5,'stroke-linecap':'round'})
  }));
  const atoms=['A','B','C'].map((id,i)=>part('circle',{r:radii[i],fill:'url(#'+id+')'}));
  const plus=part('text',{y:6,class:'axis','text-anchor':'middle'},'+');
  const formula=part('text',{y:radii[0]+Math.min(35,Math.max(21,width*.025)),class:'level','text-anchor':'middle'});
  const label=part('text',{y:-radii[0]-6,class:'name','text-anchor':'middle'});
  function place(cx,cy,t){
    const f=Math.max(0,Math.min(1,(t-.2)/.6));
    const spread=spacing*.48*(1-Math.abs(2*f-1));
    const ab=spacing*(1+f*1.5)+spread, bc=spacing*(2.5-f*1.5)+spread;
    const xs=[-(ab+bc)/2,(ab-bc)/2,(ab+bc)/2];
    const summit=Math.abs(t-.5)<.00001, separated=f===0||f===1;
    group.setAttribute('transform','translate('+cx+' '+cy+')');
    atoms.forEach((a,i)=>a.setAttribute('cx',xs[i]));
    bonds.forEach(({solid,dotted},i)=>{
      const strength=i?f:1-f;
      solid.setAttribute('x1',xs[i]);solid.setAttribute('x2',xs[i+1]);
      const gap=xs[i+1]-xs[i]-radii[i]-radii[i+1];
      dotted.setAttribute('x1',xs[i]+radii[i]+gap*.15);
      dotted.setAttribute('x2',xs[i+1]-radii[i+1]-gap*.15);
      solid.setAttribute('opacity',Math.max(0,2*strength-1));
      dotted.setAttribute('opacity',1-Math.abs(2*strength-1));
    });
    plus.style.display=separated?'':'none';
    plus.setAttribute('x',f===0?(xs[1]+xs[2])/2:(xs[0]+xs[1])/2);
    formula.textContent=f===0?'A–B + C':f===1?'A + B–C':summit?'A···B···C':'';
    label.textContent=summit?'활성화물':'';
  }
  return {group,place};
}
function arrow(px,h1,h2,color){
  const a=y(h1),b=y(h2),sign=Math.sign(b-a);
  line(px,a,px,b,{stroke:color,'stroke-width':1.6});
  for(const [py,dy] of [[a,sign*5],[b,-sign*5]]){
    node('path',{d:'M '+(px-3)+' '+(py+dy)+' L '+px+' '+py+' L '+(px+3)+' '+(py+dy),fill:'none',stroke:color,'stroke-width':1.5});
  }
}
function draw(){
  width=Math.max(255,graph.clientWidth);
  graph.setAttribute('viewBox','0 0 '+width+' 476');layer.replaceChildren();
  const left=axisX();
  for(const h of [-65,0,40,65,80]){
    line(left-5,y(h),left,y(h),{stroke:'#86958d'});text(left-8,y(h)+6,signed(h),'axis','end');
  }
  node('path',{d:'M'+left+' 38 l-3 6 m3 -6 l3 6 M'+left+' 38 V445 H'+(width-8)+' l-6 -3 m6 3 l-6 3',stroke:'#67796d',fill:'none'});
  text(width-14,469,'반응의 진행','axis','end');
  const deltaX=width-(width<570?34:48);
  line(x(.19),y(0),deltaX,y(0),{stroke:'#9aa79f','stroke-dasharray':'3 4'});
  line(x(1),y(product),deltaX,y(product),{stroke:'#9aa79f','stroke-dasharray':'3 4'});
  let path='';
  for(let i=0;i<=200;i++){const t=i/200;path+=(i?'L':'M')+x(t)+' '+y(energy(t))+' ';}
  node('path',{d:path,fill:'none',stroke:'#df4c28','stroke-width':3.5,'stroke-linecap':'round'});
  arrow(x(.5),0,peak,'#245d50');
  if(width<440){
    text(x(.5),y(40)-2,'활성화','reading');text(x(.5),y(40)+17,'에너지','reading');
  }else text(x(.5),y(40)+4,'활성화 에너지','reading');
  arrow(deltaX,0,product,'#576b82');
  text(deltaX+4,(y(0)+y(product))/2+4,'ΔH','reading','start');
  referenceModels=[0,.5,1].map((t,i)=>{
    const model=makeModel();
    model.place(x([.13,.5,.87][i]),y(energy(t))-modelOffset(),t);
    return model;
  });
  text(x(.13),y(0)+30,'반응물','name');text(x(.87),y(product)+30,'생성물','name');
  mobileModel=makeModel();
  dot=node('circle',{r:5.6,fill:'#174e41',stroke:'white','stroke-width':2});
  update(position);
}
function modelOffset(){return Math.min(73,Math.max(47,width*.07));}
function update(t){
  position=t;slider.value=Math.round(t*1000);
  dot.setAttribute('cx',x(t));dot.setAttribute('cy',y(energy(t)));
  const overview=t===0||t===1;
  referenceModels.forEach(model=>model.group.style.display=overview?'':'none');
  mobileModel.group.style.display=overview?'none':'';
  mobileModel.place(x(Math.min(.87,Math.max(.13,t))),y(energy(t))-modelOffset(),t);
  const chemistry=t<=.2?'반응물 A–B + C':t>=.8?'생성물 A + B–C':t===.5?'활성화물 A···B···C':'결합 변화 중';
  slider.setAttribute('aria-valuetext',chemistry+' · 상대 엔탈피 '+signed(Math.round(energy(t)))+' kJ/mol');
}
function stop(){cancelAnimationFrame(frame);playing=false;$('play').textContent=position===1?'↻ 다시 재생':'▶ 재생';}
function selectMode(mode){
  position=0;stop();product=mode==='exo'?-enthalpyDifference:enthalpyDifference;
  modes.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
  $('type').textContent=mode==='exo'?'발열 반응':'흡열 반응';
  $('why').textContent=mode==='exo'?'반응물의 엔탈피가 생성물보다 높아 열을 방출합니다.':'반응물의 엔탈피가 생성물보다 낮아 열을 흡수합니다.';
  $('delta').textContent=signed(product)+' − 0 = '+signed(product)+' kJ/mol';
  $('desc').textContent=$('why').textContent+' 반응물 A–B + C는 0, 봉우리의 활성화물 A···B···C는 +80, 생성물 A + B–C는 '+signed(product)+' kJ/mol.';
  draw();
}
modes.forEach(b=>b.addEventListener('click',()=>selectMode(b.dataset.mode)));
slider.addEventListener('input',()=>{update(Number(slider.value)/1000);stop()});
$('restart').addEventListener('click',()=>{update(0);stop()});
$('play').addEventListener('click',()=>{
  if(playing){stop();return}
  if(position===1)update(0);
  playing=true;$('play').textContent='Ⅱ 일시 정지';
  const from=position,start=performance.now(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const approach=Math.max(0,.5-from)*6000,hold=from<=.5?1300:0;
  function tick(now){
    const elapsed=Math.max(0,now-start);
    let t;
    if(elapsed<approach)t=from+elapsed/6000;
    else if(elapsed<approach+hold)t=.5;
    else t=Math.min(1,Math.max(from,.5)+(elapsed-approach-hold)/6000);
    update(reduced&&t<1?(t>=.5?Math.max(.5,from):from):t);
    if(t===1){stop();return}
    frame=requestAnimationFrame(tick);
  }
  frame=requestAnimationFrame(tick);
});
selectMode('exo');new ResizeObserver(()=>{if(graph.clientWidth!==width)draw()}).observe(graph);
</script></body></html>
