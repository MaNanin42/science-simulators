<script>
const compounds=JSON.parse(document.getElementById('compounds').textContent);
const categories={NONPOLAR:'비극성',POLAR_UNCHARGED:'극성 무전하',ACIDIC:'산성',BASIC:'염기성'};
const find=id=>document.getElementById(id);
const write=(id,value)=>{find(id).textContent=value};
const search=document.querySelector('.search input');
const toggle=document.querySelector('.mobile-toggle');
const smallScreen=window.matchMedia('(max-width:760px)');
let selected=compounds.find(a=>a.id==='val');
const choices=find('group-choices');
const graphic=document.querySelector('.formula-image');
const viewer=find('viewer');
let vector, activeGroup=0;
function selectGroup(index){
  activeGroup=index;
  const {groups}=selected.drawing;
  const {points}=vector;
  const group=groups[index];
  const highlight=graphic.querySelector('.highlight');
  highlight.replaceChildren();
  function mark(tag,attributes){
    const node=document.createElementNS(graphic.namespaceURI,tag);
    for(const [key,value] of Object.entries(attributes))node.setAttribute(key,value);
    highlight.append(node);
  }
  if(group){
    for(const [a,b] of group.bonds){
      const [x1,y1]=points[a], [x2,y2]=points[b];
      mark('line',{x1,y1,x2,y2,stroke:'#b5e5cf','stroke-width':18,'stroke-linecap':'round'});
    }
    for(const atom of group.atoms){
      const [cx,cy]=points[atom];
      mark('circle',{cx,cy,r:11,fill:'#b5e5cf'});
    }
  }
  for(const btn of choices.children)btn.setAttribute('aria-pressed',String(Number(btn.value)===index));
  find('group-properties').hidden=!group;
  find('whole-note').hidden=Boolean(group);
  if(group){
    write('group-water',group.water);
    write('group-ion',group.ionization);
  }else{
    write('whole-note',selected.id==='gly'?'α-탄소에 수소 두 개가 붙어 있습니다. 그림에는 그중 곁사슬에 해당하는 수소 하나를 표시했습니다.':'쐐기 결합은 화면 앞으로, 빗금 쐐기 결합은 화면 뒤로 향합니다.');
  }
  graphic.setAttribute('aria-label',selected.name+' 구조식 · '+(group?group.label+' 강조':'전체 구조'));
}
function fitStructure(){
  const stage=graphic.parentElement;
  const {wide,tall}=selected.drawing;
  function fit(drawing){
    const [, ,w,h]=drawing.box.split(' ').map(Number);
    return Math.min(stage.clientWidth/w,stage.clientHeight/h);
  }
  const next=viewer.open&&fit(tall)>fit(wide)?tall:wide;
  if(next!==vector){
    vector=next;
    graphic.setAttribute('viewBox',vector.box);
    graphic.innerHTML='<g class="highlight"></g>'+vector.paths;
    selectGroup(activeGroup);
  }
}
new ResizeObserver(fitStructure).observe(graphic.parentElement);
function drawStructure(a){
  choices.replaceChildren();
  const labels=['전체 구조',...a.drawing.groups.map(group=>group.label)];
  labels.forEach((label,i)=>{
    const button=document.createElement('button');
    button.type='button';button.value=String(i-1);button.textContent=label;
    choices.append(button);
  });
  activeGroup=0;
  fitStructure();
  selectGroup(0);
  write('viewer-title',a.name+' 분자 구조식');
  find('expand').setAttribute('aria-label',a.name+' 분자 구조식 확대');
}
choices.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(button)selectGroup(Number(button.value));
});
find('expand').addEventListener('click',()=>{
  viewer.append(find('structure-view'));
  viewer.showModal();
  fitStructure();
  find('close-view').focus();
});
find('close-view').addEventListener('click',()=>viewer.close());
viewer.addEventListener('close',()=>{
  find('inline-view').append(find('structure-view'));
  fitStructure();
  find('expand').focus({preventScroll:true});
});
function showProfile(a){
  selected=a;
  write('name',a.name);write('english',a.englishName);write('symbols',a.threeLetter+' / '+a.oneLetter);
  write('category',categories[a.category]+' 곁사슬');write('essential',a.isEssential?'필수 아미노산':'비필수 아미노산');
  write('formula',a.formula.replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[Number(d)]));write('side-chain',a.sideChain);
  write('description',a.description);write('synthesis',a.synthesisOrgans);write('sources',a.sources);write('deficiency',a.deficiency);
  write('role',a.category==='NONPOLAR'?'비극성 곁사슬은 단백질 내부에서 소수성 상호작용에 참여할 수 있습니다.':'친수성 곁사슬은 단백질 표면에서 물이나 다른 극성 그룹과 상호작용할 수 있습니다.');
  find('source').href='https://pubchem.ncbi.nlm.nih.gov/compound/'+a.cid;
  drawStructure(a);
  for(const btn of find('groups').querySelectorAll('button'))btn.setAttribute('aria-pressed',String(btn.dataset.id===a.id));
}
function buildIndex(){
  const q=search.value.trim().toLowerCase();
  const matches=compounds.filter(a=>[a.name,a.englishName,a.threeLetter].some(s=>s.toLowerCase().includes(q))||a.oneLetter.toLowerCase()===q);
  find('groups').replaceChildren();
  write('result-count',matches.length+'종');
  document.querySelector('.empty').hidden=matches.length>0;
  for(const [key,label] of Object.entries(categories)){
    const items=matches.filter(a=>a.category===key);
    if(!items.length)continue;
    const section=document.createElement('section');section.className='group';
    const h=document.createElement('h3');h.className='group-title';h.textContent=label+' 곁사슬';
    const count=document.createElement('span');count.className='group-count';count.textContent=items.length;h.append(count);
    const options=document.createElement('div');options.className='options';
    for(const a of items){
      const b=document.createElement('button');b.type='button';b.className='entry';b.dataset.id=a.id;b.setAttribute('aria-pressed',String(a.id===selected.id));
      const name=document.createElement('span');name.textContent=a.name;
      const code=document.createElement('small');code.textContent=a.threeLetter;b.append(name,code);options.append(b);
    }
    section.append(h,options);find('groups').append(section);
  }
}
const indexState={desktop:true,mobile:false};
function openIndex(open){
  indexState[smallScreen.matches?'mobile':'desktop']=open;
  document.querySelector('.index').classList.toggle('expanded',open);
  find('picker').hidden=!open;
  toggle.setAttribute('aria-expanded',String(open));
  toggle.textContent=open?(smallScreen.matches?'아미노산 목록 접기':'접기'):'아미노산 목록 펼치기';
  toggle.setAttribute('aria-label',open?'아미노산 목록 접기':'아미노산 목록 펼치기');
}
function fitIndex(){
  const open=indexState[smallScreen.matches?'mobile':'desktop'];
  if(!open&&find('picker').contains(document.activeElement))toggle.focus();
  openIndex(open);
}
smallScreen.addEventListener('change',fitIndex);
fitIndex();
toggle.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')==='false';openIndex(open);if(open)search.focus()});
find('groups').addEventListener('click',e=>{
  const button=e.target.closest('button[data-id]');if(!button)return;
  showProfile(compounds.find(a=>a.id===button.dataset.id));
  if(smallScreen.matches){openIndex(false);toggle.focus();toggle.scrollIntoView({block:'nearest'})}
});
search.addEventListener('input',buildIndex);
find('clear').addEventListener('click',()=>{search.value='';buildIndex();search.focus()});
document.querySelector('.index').addEventListener('keydown',e=>{
  if(e.key==='Escape'&&toggle.getAttribute('aria-expanded')==='true'){openIndex(false);toggle.focus()}
});
buildIndex();showProfile(selected);
</script>
</body>
</html>
